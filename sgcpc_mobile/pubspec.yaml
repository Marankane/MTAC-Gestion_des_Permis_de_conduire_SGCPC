name: sgcpc_mobile
description: "SGCPC - Application mobile de saisie terrain (Police/Gendarmerie) - Ministère des Transports du Niger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau / API
  http: ^1.2.1

  # Stockage sécurisé des tokens JWT
  flutter_secure_storage: ^9.2.2

  # Base locale (file d'attente hors-ligne + cache des dossiers)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Détection de connectivité (déclenche la synchronisation automatique)
  connectivity_plus: ^6.0.3

  # Photos (permis confisqué, carte grise, PV...)
  image_picker: ^1.1.2

  # État de l'application
  provider: ^6.1.2

  # Identifiants locaux temporaires (dossiers créés hors-ligne, pas encore de n° officiel)
  uuid: ^4.4.0

  # Formatage dates
  intl: ^0.19.0

  # Affichage du QR code du permis vérifié
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
